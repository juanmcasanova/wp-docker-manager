[project]
name = "wp-docker-manager"
version = "0.1.0"
description = "CLI application to manage WordPress instances in a shared Docker environment"
readme = "README.md"
authors = [
    { name = "Juan Manuel Casanova González", email = "juan.casanova.922@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "docker>=7.2.0",
]

[project.scripts]
wp-docker-manager = "wp_docker_manager:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
